# WiiVolve: hourly build and deploy, weekly self-check. Contract: docs/ARCHITECTURE.md section 9.
# One-time setup (secrets, Cloudflare token, domain): docs/RUNBOOK.md.
#
#   every hour at :17      test, build; commit and deploy when the build reports changed=true, and deploy
#                          the committed site again when the live one is behind (a deploy that failed)
#   push to main           test, build --force, commit if anything changed, deploy
#   Run workflow (manual)  task "build" does what a push does; task "check" runs the self-check now
#   Mondays 09:00 UTC      node scripts/check.mjs: opens, comments on or closes one site-check issue
#   pull request to main   tests and an offline dry build; nothing is committed or deployed
#
# The repository variable DEPLOY_HOLD=true pauses every deploy (builds and commits go on); see RUNBOOK.
# Pushes made with GITHUB_TOKEN never start another run, so the bot's own commits cannot loop.

name: site

on:
  schedule:
    - cron: "17 * * * *"   # hourly build (minute 17 avoids the busy top of the hour)
    - cron: "0 9 * * 1"    # weekly self-check, Monday 09:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: "build: rebuild and deploy now. check: run the weekly self-check now."
        type: choice
        options: [build, check]
        default: build

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and deploy
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # commit the refreshed news back to the repository
    concurrency:
      group: site-build        # builds never overlap; queued builds wait for the running one
      cancel-in-progress: false
      queue: max               # without it a waiting push run is cancelled when the hourly run queues
    steps:
      # The branch tip, not the commit that triggered the run: a run that waited in the queue must
      # start from the state the previous run committed. The token is not left on disk: only the
      # Commit step gets it, so no other step (wrangler included) can push to the repository.
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26               # pinned: an LTS switch never happens unattended (ARCHITECTURE 1.3)
          package-manager-cache: false   # no dependencies, nothing to cache

      - name: Test
        run: npm test

      # Writes changed=true|false and summary=... to $GITHUB_OUTPUT and a sources table to the
      # job summary. Scheduled runs write the site only when something changed; pushes and manual
      # runs use --force so code changes always deploy.
      - name: Build
        id: build
        env:
          FORCE: ${{ github.event_name != 'schedule' && '--force' || '' }}
        run: node scripts/build-news.mjs $FORCE

      - name: Commit
        id: commit
        if: steps.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          SUMMARY: ${{ steps.build.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same auth header actions/checkout would have persisted, for this step only.
          b64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          bash scripts/commit-if-changed.sh

      # An unchanged run still deploys when the live site is behind the committed build, so a deploy that
      # failed (npm, Cloudflare, an expired token) is retried every hour instead of waiting for the next
      # change. Any failure to read the live health.json counts as behind.
      - name: Is the live site behind?
        id: live
        if: >-
          steps.build.outputs.changed != 'true' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOLD != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          node --input-type=module -e '
            import { readFile, appendFile } from "node:fs/promises";
            import { parseJsonLoose } from "./scripts/lib/util.mjs";
            const site = (process.env.SITE_URL || parseJsonLoose(await readFile("feeds.json", "utf8")).site.url).replace(/\/+$/, "");
            const local = JSON.parse(await readFile("site/health.json", "utf8")).generatedAt;
            let live = null;
            try {
              const res = await fetch(`${site}/health.json`, { signal: AbortSignal.timeout(20000), headers: { "cache-control": "no-cache" } });
              if (res.ok) live = (await res.json()).generatedAt ?? null;
            } catch {}
            const behind = live !== local;
            console.log(`committed build ${local}, live ${live ?? "unreachable"}: ${behind ? "behind, deploying again" : "up to date"}`);
            await appendFile(process.env.GITHUB_OUTPUT, `behind=${behind}\n`);
          '

      - name: Deploys on hold
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOLD == 'true'
        run: |
          msg="The repository variable DEPLOY_HOLD is true, so this run deploys nothing (docs/RUNBOOK.md, Operations). Delete the variable to resume; the next run then deploys the latest build."
          echo "::notice title=Deploy on hold::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare
        if: >-
          github.ref == 'refs/heads/main' && vars.DEPLOY_HOLD != 'true' &&
          steps.commit.outputs.result != 'conflict' && steps.commit.outputs.superseded != 'true' &&
          (steps.build.outputs.changed == 'true' || steps.live.outputs.behind == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            msg="Deploy skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are not both set (docs/RUNBOOK.md, step 8). The build and commit ran; the live site is unchanged."
            echo "::warning title=Deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4.157.0 deploy
          echo "Deployed $(git rev-parse --short HEAD) to Cloudflare." >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Weekly self-check
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 30        # check.mjs stops checking archive links after 8 minutes on its own
    permissions:
      contents: read           # read feeds.json and the script
      issues: write            # the site-check label and issue
    concurrency:
      group: site-check
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      # Exits 0 once the issue is up to date (the issue is the notification) and 1 only if
      # GitHub itself fails. SITE_URL is an optional repository variable that overrides
      # feeds.json, for example to check the workers.dev address before the domain is attached.
      - name: Check the live site
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/check.mjs

  verify:
    name: Test and dry build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Test
        run: npm test

      - name: Dry build from the saved fixtures
        run: npm run build:offline
